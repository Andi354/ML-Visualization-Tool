[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-visualization-tool"
version = "0.2.4"
description = "Local results tool for ds-init projects: runs, experiments, comparisons and deliverables."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyarrow>=16",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6",
  "httpx>=0.27",
  "ds-store>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-playwright>=0.5", "playwright>=1.45", "pillow>=10"]

[project.scripts]
mlviz = "mlviz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlviz"]

[tool.hatch.build.targets.wheel.force-include]
"src/mlviz/static" = "mlviz/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: Playwright tests (headless Chromium)"]
addopts = "-m 'not browser'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]
