<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Analyse</title>
<script src="./support.js"></script>
<script src="./cmp-data.js"></script>
<script src="./one-data.js"></script>
<script src="./f-data.js"></script>
<script src="./g-shared.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#0D1016}</style>
</helmet>
<div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: #0D1016; font-family: 'IBM Plex Sans', sans-serif;">
<div style="flex-shrink: 0; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 28px; border-bottom: 1px solid #262E3E; background: #0F131B;">
<span style="font-size: 12px; color: #8590A3;">Umfang</span>
<div style="display: flex; padding: 2px; gap: 2px; background: #131720; border: 1px solid #262E3E; border-radius: 5px;"><sc-for list="{{scopes}}" as="s" hint-placeholder-count="3"><button style="{{s.st}}" onClick="{{s.on}}">{{s.label}}</button></sc-for></div>
</div>
<div style="flex: 1; min-height: 0;">
<sc-if value="{{one}}" hint-placeholder-val="{{true}}"><dc-import name="G1-Board" embedded="{{true}}" hint-size="100%,100%"></dc-import></sc-if>
<sc-if value="{{two}}" hint-placeholder-val="{{false}}"><dc-import name="E4-Analyse" embedded="{{true}}" view="two" hint-size="100%,100%"></dc-import></sc-if>
<sc-if value="{{proj}}" hint-placeholder-val="{{false}}"><dc-import name="E4-Analyse" embedded="{{true}}" view="proj" hint-size="100%,100%"></dc-import></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
renderVals() {
  const st = this.state || {}, set = (p) => this.setState(p), sc = st.scope || 'one', seg = window.GShared.seg;
  return {
    one: sc === 'one', two: sc === 'two', proj: sc === 'proj',
    scopes: [['one', 'Ein Lauf'], ['two', 'Zwei Läufe'], ['proj', 'Projektverlauf']].map(([k, l]) => ({ label: l, st: seg(sc === k), on: () => set({ scope: k }) }))
  };
}
}
</script>
</body>
</html>
