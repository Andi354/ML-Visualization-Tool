<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>G1 · Board</title>
<script src="./support.js"></script>
<script src="./one-data.js"></script>
<script src="./g-shared.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D1016}
button{font-family:'IBM Plex Sans',sans-serif}
button:focus-visible,a:focus-visible{outline:2px solid #6E9BF5;outline-offset:1px}
.card{background:#131720;border:1px solid #262E3E;border-radius:6px;padding:14px 16px;box-sizing:border-box;min-width:0}
.ct{font-weight:600;font-size:13px;margin:0 0 2px}
.cs{font-size:12px;color:#8590A3;margin:0 0 12px}
.mono{font-family:'IBM Plex Mono',monospace}
.chip{font:400 12px 'IBM Plex Mono',monospace;padding:2px 7px;border-radius:3px;border:1px solid #262E3E;background:#1A2030;color:#A1AABB;white-space:nowrap}
</style>
</helmet>
<div style="width: 100%; height: {{rootH}}; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #0D1016; color: #E4E8EF; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; overflow: hidden;">
<div style="flex-shrink: 0; min-height: 52px; box-sizing: border-box; padding: 8px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; border-bottom: 1px solid #262E3E; position: relative;">
<span>Analyse</span><span style="color: #8590A3;">/</span><span style="color: #A1AABB;">Ein Lauf</span>
<span class="mono" style="margin-left: 12px; color: #A1AABB;">{{runName}}</span>
<span style="flex: 1;"></span>
<button onClick="{{toggleAdd}}" style="font: 500 12px 'IBM Plex Sans', sans-serif; cursor: pointer; border-radius: 4px; padding: 6px 12px; border: 1px solid #262E3E; background: #131720; color: #E4E8EF;">+ Widget</button>
<button onClick="{{openDlg}}" style="font: 500 13px 'IBM Plex Sans', sans-serif; color: #0D1016; background: #6E9BF5; border: 0; border-radius: 4px; padding: 7px 14px; cursor: pointer;">Als Deliverable speichern</button>
<sc-if value="{{add}}" hint-placeholder-val="{{false}}">
<div role="menu" style="position: absolute; right: 200px; top: 50px; z-index: 5; width: 360px; background: #131720; border: 1px solid #2C4572; border-radius: 6px; padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,0.5);">
<sc-for list="{{catalog}}" as="c" hint-placeholder-count="5"><button onClick="{{c.add}}" style="width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px; background: none; border: 0; border-radius: 4px; padding: 8px 10px; cursor: pointer; color: #E4E8EF;"><span style="font-size: 13px;">{{c.label}}</span><span style="font-size: 12px; color: #8590A3;">{{c.q}}</span></button></sc-for>
</div>
</sc-if>
</div>
<div style="flex: 1; min-height: 0; overflow: auto; padding: 18px 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-content: start;">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8590A3;"><span style="color: #A1AABB; font-weight: 500;">{{t.label}}</span><span>· {{t.q}}</span><span style="flex: 1;"></span>
<button onClick="{{t.toggle}}" style="{{t.setBtn}}">Einstellen</button><button onClick="{{t.remove}}" aria-label="Widget entfernen" style="background: none; border: 0; color: #8590A3; cursor: pointer; font-size: 15px;">×</button><button onClick="{{t.saveOne}}" title="Als Deliverable speichern" aria-label="Dieses Widget als Deliverable speichern" style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 4px; background: #6E9BF5; color: #0D1016; cursor: pointer;"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 2.5h8.5l2.5 2.5v8.5h-11z"/><path d="M5 2.5v3.5h5.5V2.5"/><rect x="5" y="9" width="6" height="4.5"/></svg></button></div>
<sc-if value="{{t.open}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 10px; background: #131720; border: 1px solid #2C4572; border-radius: 6px;">
<sc-for list="{{t.ctrls}}" as="g" hint-placeholder-count="2"><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8590A3;">{{g.label}}<span style="display: flex; padding: 2px; gap: 2px; background: #0D1016; border: 1px solid #262E3E; border-radius: 5px;"><sc-for list="{{g.items}}" as="i" hint-placeholder-count="3"><button style="{{i.st}}" onClick="{{i.on}}">{{i.label}}</button></sc-for></span></span></sc-for>
<sc-if value="{{t.noCtrl}}"><span style="font-size: 12px; color: #8590A3;">Keine Einstellungen für dieses Widget</span></sc-if>
</div></sc-if>
<dc-import name="W-Widget" type="{{t.type}}" opts="{{t.opts}}" theme="dark" hint-size="100%,420px"></dc-import>
</div>
</sc-for>
</div>
<sc-if value="{{dlg}}" hint-placeholder-val="{{false}}">
<div onClick="{{closeDlg}}" style="position: absolute; inset: 0; background: rgba(6, 8, 12, 0.65);"></div>
<div role="dialog" aria-label="Als Deliverable speichern" style="position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 1180px; height: 800px; box-sizing: border-box; background: #131720; border: 1px solid #262E3E; border-radius: 8px; box-shadow: 0 16px 48px rgba(0,0,0,0.55); display: grid; grid-template-columns: 300px minmax(0, 1fr); overflow: hidden;">
<div style="border-right: 1px solid #262E3E; padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow: auto;">
<div style="font-size: 15px; font-weight: 600;">Als Deliverable speichern</div>
<div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: #8590A3;">Widgets · ein Widget = ein Bild</span>
<sc-for list="{{pick}}" as="p" hint-placeholder-count="4"><div style="{{p.rowSt}}" onClick="{{p.focus}}"><input type="checkbox" checked="{{p.on}}" onChange="{{p.toggle}}" style="accent-color: #6E9BF5;"><span style="flex: 1; min-width: 0;">{{p.label}}</span><input value="{{p.file}}" onInput="{{p.onName}}" disabled="{{p.off}}" aria-label="Dateiname" class="mono" style="width: 130px; font-size: 11px; color: #E4E8EF; background: #0D1016; border: 1px solid #262E3E; border-radius: 3px; padding: 3px 5px;"></div></sc-for></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; color: #8590A3;">Hintergrund</span><div style="display: flex; padding: 2px; gap: 2px; background: #0D1016; border: 1px solid #262E3E; border-radius: 5px; align-self: flex-start;"><sc-for list="{{themes}}" as="t" hint-placeholder-count="2"><button style="{{t.st}}" onClick="{{t.on}}">{{t.label}}</button></sc-for></div></div>
<label style="display: flex; gap: 10px; align-items: center; cursor: pointer;"><input type="checkbox" checked="{{withCfg}}" onChange="{{toggleCfg}}" style="accent-color: #6E9BF5;"><span>Configs des Laufs mitspeichern</span></label>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: #0D1016; border: 1px solid #262E3E; border-radius: 4px;"><span class="mono" style="font-size: 12px; word-break: break-all;">{{path}}</span><span style="font-size: 12px; color: #8590A3;">{{fileList}} · verknüpft mit TIM-52</span></div>
<span style="flex: 1;"></span>
<div style="display: flex; gap: 8px;"><button onClick="{{closeDlg}}" style="font: 500 13px 'IBM Plex Sans', sans-serif; color: #A1AABB; background: none; border: 1px solid #262E3E; border-radius: 4px; padding: 7px 14px; cursor: pointer;">Abbrechen</button><button onClick="{{save}}" disabled="{{noSave}}" style="{{saveSt}} flex: 1; font: 500 13px 'IBM Plex Sans', sans-serif; color: #0D1016; background: #6E9BF5; border: 0; border-radius: 4px; padding: 7px 14px; cursor: pointer;">{{saveLabel}}</button></div>
</div>
<div style="padding: 18px 24px; overflow: auto; background: {{previewBg}};">
<div style="font-size: 12px; color: #8590A3; margin-bottom: 10px;">Vorschau · so wird {{previewName}} gespeichert</div>
<dc-import name="W-Widget" type="{{prev.type}}" opts="{{prev.opts}}" title="{{prev.title}}" theme="{{theme}}" hint-size="100%,460px"></dc-import>
</div>
</div>
</sc-if>
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 16px; background: #11221B; border: 1px solid #245A45; border-radius: 6px; color: #5FD4A0; font-size: 12px; display: flex; gap: 10px; align-items: center;"><span>Gespeichert: {{savedText}}</span><button onClick="{{hideSaved}}" style="background: none; border: 0; color: #8590A3; cursor: pointer;">×</button></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900},"embedded":{"editor":null},"view":{"editor":null}}'>
class Component extends DCLogic {
renderVals() {
  const G = window.GShared, D = window.OneData;
  const st = this.state || {};
  const set = (p) => this.setState(p);
  // save dialog (shared by G1–G3): list = [{id, type, opts, title, label}]
  const saveVals = (list, preselect) => {
    const sel = st.sel || preselect || {}, theme = st.theme || 'light';
    const chosen = list.filter((w) => sel[w.id]);
    const focus = list.find((w) => w.id === st.focus) || chosen[0] || list[0];
    const names = st.names || {};
    const fname = (w, i) => names[w.id] || String(i + 1).padStart(2, '0') + '_' + w.type + '.png';
    const files = chosen.map(fname).concat(st.withCfg === false || !chosen.length ? [] : ['configs/']);
    const path = 'deliverables/2026-10-14 ' + (st.dTitle || 'TIM-52 Modellvergleich') + '/';
    return {
    rootH: (this.props || {}).embedded ? '100%' : '900px',
      dlg: !!st.dlg, closeDlg: () => set({ dlg: false }),
      pick: list.map((w, i) => ({
        label: w.label, on: !!sel[w.id], off: !sel[w.id], file: sel[w.id] ? fname(w, chosen.indexOf(w)) : '–', onName: (e) => set({ names: Object.assign({}, names, { [w.id]: e.target.value }) }),
        toggle: () => set({ sel: Object.assign({}, sel, { [w.id]: !sel[w.id] }) }), focus: () => set({ focus: w.id }),
        rowSt: 'display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 4px; cursor: pointer; border: 1px solid ' + (focus && focus.id === w.id ? '#2C4572' : 'transparent') + '; background: ' + (focus && focus.id === w.id ? '#192640' : 'transparent') + ';'
      })),
      themes: [['light', 'hell, für Folien'], ['dark', 'dunkel']].map(([k, l]) => ({ label: l, st: window.GShared.seg(theme === k), on: () => set({ theme: k }) })),
      theme, previewBg: theme === 'light' ? '#E9ECF1' : '#0D1016',
      prev: focus ? { type: focus.type, opts: focus.opts, title: focus.title || '' } : { type: 'table', opts: {}, title: '' },
      previewName: focus ? '„' + focus.label + '“' : '',
      withCfg: st.withCfg !== false, toggleCfg: () => set({ withCfg: st.withCfg === false }),
      path, fileList: files.join(', '),
      saveLabel: chosen.length === 0 ? 'Widgets auswählen' : chosen.length === 1 ? '1 Bild speichern' : chosen.length + ' Bilder speichern',
      noSave: chosen.length === 0, saveSt: chosen.length ? '' : 'opacity: 0.45; cursor: default;',
      save: () => { if (chosen.length) set({ dlg: false, saved: true, savedText: path + ' · ' + files.join(', ') }); },
      saved: !!st.saved, savedText: st.savedText || '', hideSaved: () => set({ saved: false })
    };
  };
  const tiles = st.tiles || G.CAT.map((c, i) => ({ id: 'w' + i, type: c.key, opts: Object.assign({}, c.opts) }));
  const upd = (id, patch) => set({ tiles: tiles.map((t) => t.id === id ? Object.assign({}, t, patch) : t) });
  const list = tiles.map((t) => ({ id: t.id, type: t.type, opts: t.opts, label: G.byKey(t.type).label }));
  return Object.assign({
    runName: D.RUN.id, add: !!st.add, toggleAdd: () => set({ add: !st.add }),
    catalog: G.CAT.map((c) => ({ label: c.label, q: c.q, add: () => set({ add: false, tiles: tiles.concat({ id: 'w' + Date.now(), type: c.key, opts: Object.assign({}, c.opts) }) }) })),
    openDlg: () => set({ dlg: true, add: false, sel: {} }),
    tiles: tiles.map((t) => {
      const c = G.byKey(t.type), ctrls = G.controls(t.type, t.opts, (p) => upd(t.id, { opts: Object.assign({}, t.opts, p) }));
      return {
        type: t.type, opts: t.opts, label: c.label, q: c.q, open: !!t.open, ctrls, noCtrl: ctrls.length === 0,
        setBtn: "font: 500 12px 'IBM Plex Sans', sans-serif; cursor: pointer; border-radius: 4px; padding: 3px 9px; border: 1px solid " + (t.open ? '#2C4572' : '#262E3E') + '; background: ' + (t.open ? '#192640' : 'transparent') + '; color: #A1AABB;',
        saveOne: () => set({ dlg: true, add: false, sel: { [t.id]: true }, focus: t.id }),
        toggle: () => upd(t.id, { open: !t.open }), remove: () => set({ tiles: tiles.filter((x) => x.id !== t.id) })
      };
    })
  }, saveVals(list));
}
}
</script>
</body>
</html>
