<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>I1 · Kombinieren in der Liste</title>
<script src="./support.js"></script>
<script src="./one-data.js"></script>
<script src="./g-shared.js"></script>
<script src="./i-shared.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D1016}
button{font-family:'IBM Plex Sans',sans-serif}
button:focus-visible,a:focus-visible{outline:2px solid #6E9BF5;outline-offset:1px}
.card{background:#131720;border:1px solid #262E3E;border-radius:6px;padding:14px 16px;box-sizing:border-box;min-width:0}
.ct{font-weight:600;font-size:13px;margin:0 0 2px}
.cs{font-size:12px;color:#8590A3;margin:0 0 12px}
.mono{font-family:'IBM Plex Mono',monospace}
.chip{font:400 12px 'IBM Plex Mono',monospace;padding:2px 7px;border-radius:3px;border:1px solid #262E3E;background:#1A2030;color:#A1AABB;white-space:nowrap}
</style>
</helmet>
<div style="width: 100%; height: 900px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #0D1016; color: #E4E8EF; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; overflow: hidden;">
<div style="flex-shrink: 0; min-height: 52px; box-sizing: border-box; padding: 8px 24px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #262E3E; background: #131720;">
<span style="font-size: 15px; font-weight: 600;">Als Deliverable speichern</span><span style="color: #8590A3; font-size: 12px;">· TIM-52 Modellvergleich · {{hint}}</span>
</div>
<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 420px minmax(0, 1fr);">
<div style="border-right: 1px solid #262E3E; display: flex; flex-direction: column; min-height: 0;">
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #262E3E;">
<span style="font-size: 12px; color: #8590A3;">{{markText}}</span><span style="flex: 1;"></span>
<button onClick="{{combine}}" disabled="{{noCombine}}" style="{{combineSt}}">Zu einem Bild</button>
</div>
<div style="flex: 1; overflow: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{outs}}" as="o" hint-placeholder-count="5">
<div style="{{o.boxSt}}" onClick="{{o.focus}}">
<input type="checkbox" checked="{{o.sel}}" onChange="{{o.toggle}}" onClick="{{o.stop}}" aria-label="Bild auswählen" style="accent-color: #6E9BF5; margin-top: 7px;">
<div style="flex: 1; min-width: 0;">
<sc-if value="{{o.group}}"><div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;"><span style="font-size: 11px; color: #6E9BF5;">1 Bild · {{o.count}} Widgets</span><span style="flex: 1;"></span>
<span style="display: flex; padding: 2px; gap: 2px; background: #0D1016; border: 1px solid #262E3E; border-radius: 5px;"><sc-for list="{{o.layouts}}" as="l" hint-placeholder-count="2"><button style="{{l.st}}" onClick="{{l.on}}">{{l.label}}</button></sc-for></span>
<button onClick="{{o.split}}" style="font: 500 11px 'IBM Plex Sans', sans-serif; background: none; border: 1px solid #262E3E; border-radius: 4px; color: #A1AABB; padding: 3px 8px; cursor: pointer;">Trennen</button></div></sc-if>
<sc-for list="{{o.members}}" as="m" hint-placeholder-count="1"><div style="display: flex; align-items: center; gap: 8px; padding: 5px 2px;">
<span style="flex: 1; font-size: 13px;">{{m.label}}</span>
<sc-if value="{{o.group}}"><button onClick="{{m.up}}" aria-label="nach oben" style="background: none; border: 0; color: #8590A3; cursor: pointer;">↑</button><button onClick="{{m.down}}" aria-label="nach unten" style="background: none; border: 0; color: #8590A3; cursor: pointer;">↓</button><button onClick="{{m.detach}}" style="background: none; border: 0; color: #8590A3; cursor: pointer; font-size: 11px;">lösen</button></sc-if>
</div></sc-for>
<div style="display: flex; align-items: center; gap: 6px; margin-top: 4px;"><span style="font-size: 11px; color: #8590A3;">Datei</span><input value="{{o.name}}" onInput="{{o.onName}}" aria-label="Dateiname" class="mono" style="flex: 1; min-width: 0; font-size: 12px; color: #E4E8EF; background: #0D1016; border: 1px solid #262E3E; border-radius: 4px; padding: 4px 7px;"></div>
</div>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; min-width: 0; min-height: 0;">
<div style="flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid #262E3E;">
<span style="font-size: 12px; color: #8590A3;">Vorschau</span><span class="mono" style="font-size: 12px; color: #E4E8EF;">{{cur.name}}</span>
<span style="flex: 1;"></span>
<label style="display: flex; gap: 6px; align-items: center; cursor: pointer; font-size: 12px; color: #A1AABB; margin-right: 8px;"><input type="checkbox" checked="{{showNote}}" onChange="{{toggleNote}}" style="accent-color: #6E9BF5;">Hinweise einblenden</label>
<label style="display: flex; gap: 6px; align-items: center; cursor: pointer; font-size: 12px; color: #A1AABB; margin-right: 8px;"><input type="checkbox" checked="{{showFoot}}" onChange="{{toggleFoot}}" style="accent-color: #6E9BF5;">Fußzeile einblenden</label>
<span style="font-size: 12px; color: #8590A3;">Titel</span>
<input value="{{cur.title}}" onInput="{{cur.onTitle}}" placeholder="{{cur.titlePh}}" aria-label="Titel des Bildes" style="width: 360px; font: 400 13px 'IBM Plex Sans', sans-serif; color: #E4E8EF; background: #1A2030; border: 1px solid #262E3E; border-radius: 4px; padding: 6px 9px;">
</div>
<div style="flex: 1; min-height: 0; overflow: auto; padding: 22px 26px; background: {{previewBg}};">
<dc-import name="I-Preview" parts="{{cur.parts}}" layout="{{cur.layout}}" title="{{cur.titleShown}}" theme="{{theme}}" no-note="{{noNote}}" no-foot="{{noFoot}}" hint-size="100%,460px"></dc-import>
</div>
<div style="flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid #262E3E;">
<span style="font-size: 12px; color: #8590A3;">Hintergrund</span>
<div style="display: flex; padding: 2px; gap: 2px; background: #0D1016; border: 1px solid #262E3E; border-radius: 5px;"><sc-for list="{{themes}}" as="t" hint-placeholder-count="2"><button style="{{t.st}}" onClick="{{t.on}}">{{t.label}}</button></sc-for></div>
<label style="display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: 12px; color: #A1AABB;"><input type="checkbox" checked="{{withCfg}}" onChange="{{toggleCfg}}" style="accent-color: #6E9BF5;">Configs mitspeichern</label>
<span class="mono" style="font-size: 12px; color: #8590A3;">{{path}}</span>
<span style="flex: 1;"></span>
<button style="font: 500 13px 'IBM Plex Sans', sans-serif; color: #A1AABB; background: none; border: 1px solid #262E3E; border-radius: 4px; padding: 7px 14px; cursor: pointer;">Abbrechen</button>
<button onClick="{{save}}" disabled="{{noSave}}" style="{{saveSt}} font: 500 13px 'IBM Plex Sans', sans-serif; color: #0D1016; background: #6E9BF5; border: 0; border-radius: 4px; padding: 7px 14px; cursor: pointer;">{{saveLabel}}</button>
</div>
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); padding: 10px 16px; background: #11221B; border: 1px solid #245A45; border-radius: 6px; color: #5FD4A0; font-size: 12px;">Gespeichert: {{savedText}}</div></sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const st = this.state || {};
  const set = (p) => this.setState(p);
  // shared right-hand side: preview of the focused output, theme, path, save
  const I = window.IShared, theme = st.theme || 'light', names = st.names || {}, titles = st.titles || {};
  const rightVals = (outs, focusId) => {
    const idx = Math.max(0, outs.findIndex((o) => o.id === focusId)), o = outs[idx];
    const nameOf = (x, i) => names[x.id] || I.defaultName(x, i);
    const files = outs.map(nameOf).concat(st.withCfg === false ? [] : ['configs/']);
    const path = 'deliverables/2026-10-15 TIM-52 Modellvergleich/';
    return {
      nameOf,
      cur: o ? {
        name: nameOf(o, idx), layout: o.layout, parts: o.ids.map((x) => ({ type: I.w(x).type, opts: I.w(x).opts })),
        title: titles[o.id] || '', titlePh: o.ids.length > 1 ? I.defaultTitle(o) : 'automatisch aus den Daten',
        titleShown: titles[o.id] || I.defaultTitle(o), onTitle: (e) => set({ titles: Object.assign({}, titles, { [o.id]: e.target.value }) })
      } : { name: '', layout: 'stack', parts: [], title: '', titlePh: '', titleShown: '', onTitle: () => {} },
      theme, previewBg: theme === 'light' ? '#E9ECF1' : '#0D1016',
      themes: [['light', 'hell'], ['dark', 'dunkel']].map(([k, l]) => ({ label: l, st: window.GShared.seg(theme === k), on: () => set({ theme: k }) })),
      withCfg: st.withCfg !== false, toggleCfg: () => set({ withCfg: st.withCfg === false }),
      path, saveLabel: outs.length === 1 ? '1 Bild speichern' : outs.length + ' Bilder speichern',
      save: () => set({ saved: true, savedText: path + ' · ' + files.join(', ') }), saved: !!st.saved, savedText: st.savedText || ''
    };
  };
  const nameInput = (o, i, nameOf) => ({ name: nameOf(o, i), onName: (e) => set({ names: Object.assign({}, names, { [o.id]: e.target.value }) }) });
  const outs = st.outs || I.singles(), sel = st.sel || {};
  const focus = st.focus || outs[0].id, R = rightVals(outs, focus);
  // one selection per image: it decides what is saved and what "Zu einem Bild" merges; nothing is preselected
  const chosen = outs.filter((o) => sel[o.id]);
  const seg = window.GShared.seg;
  const files = chosen.map((o) => R.nameOf(o, outs.indexOf(o))).concat(st.withCfg === false || !chosen.length ? [] : ['configs/']);
  // small note line under each graphic: on for single images, off for combined ones, per image switchable
  const fo = outs.find((o) => o.id === focus) || outs[0], notes = st.notes || {};
  const showNote = notes[fo.id] !== undefined ? notes[fo.id] : fo.ids.length < 2;
  return Object.assign(R, {
    showFoot: (st.feet || {})[fo.id] !== false, noFoot: (st.feet || {})[fo.id] === false,
    toggleFoot: () => set({ feet: Object.assign({}, st.feet, { [fo.id]: (st.feet || {})[fo.id] === false }) }),
    showNote, noNote: !showNote, toggleNote: () => set({ notes: Object.assign({}, notes, { [fo.id]: !showNote }) }),
    hint: 'Bilder auswählen · ausgewählte speichern oder mit „Zu einem Bild“ kombinieren',
    markText: chosen.length ? chosen.length + ' ausgewählt' : 'Nichts ausgewählt',
    noCombine: chosen.length < 2,
    combineSt: "font: 500 12px 'IBM Plex Sans', sans-serif; border-radius: 4px; padding: 6px 12px; cursor: " + (chosen.length < 2 ? 'default' : 'pointer') + '; border: 1px solid ' + (chosen.length < 2 ? '#262E3E' : '#2C4572') + '; background: ' + (chosen.length < 2 ? 'transparent' : '#192640') + '; color: ' + (chosen.length < 2 ? '#4A5568' : '#E4E8EF') + ';',
    combine: () => {
      if (chosen.length < 2) return;
      const ids = [].concat(...chosen.map((o) => o.ids)), n = I.combine(outs, ids), g = n.find((o) => o.ids.indexOf(ids[0]) >= 0);
      set({ outs: n, sel: { [g.id]: true }, focus: g.id });
    },
    noSave: chosen.length === 0,
    saveSt: chosen.length ? '' : 'opacity: 0.45; cursor: default;',
    saveLabel: chosen.length === 0 ? 'Bilder auswählen' : chosen.length === 1 ? '1 Bild speichern' : chosen.length + ' Bilder speichern',
    save: () => { if (chosen.length) set({ saved: true, savedText: R.path + ' · ' + files.join(', ') }); },
    outs: outs.map((o, i) => Object.assign(nameInput(o, i, R.nameOf), {
      group: o.ids.length > 1, count: String(o.ids.length), focus: () => set({ focus: o.id }),
      sel: !!sel[o.id], toggle: () => set({ sel: Object.assign({}, sel, { [o.id]: !sel[o.id] }) }), stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
      boxSt: 'display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; cursor: pointer; background: ' + (o.ids.length > 1 ? '#111827' : 'transparent') + '; border: 1px solid ' + (o.id === focus ? '#6E9BF5' : o.ids.length > 1 ? '#2C4572' : '#262E3E') + ';' + (o.ids.length > 1 ? ' border-left: 3px solid #6E9BF5;' : ''),
      layouts: [['stack', 'übereinander'], ['side', 'nebeneinander']].map(([k, l]) => ({ label: l, st: seg(o.layout === k), on: () => set({ outs: I.setLayout(outs, o.id, k) }) })),
      split: () => set({ outs: I.split(outs, o.id) }),
      members: o.ids.map((x) => ({
        label: I.w(x).label,
        up: () => set({ outs: I.reorder(outs, o.id, x, -1) }), down: () => set({ outs: I.reorder(outs, o.id, x, 1) }), detach: () => set({ outs: I.detach(outs, x) })
      }))
    }))
  });
}
}
</script>
</body>
</html>
