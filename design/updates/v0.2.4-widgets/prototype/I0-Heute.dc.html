<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>I0 · Heute (Vergleich)</title>
<script src="./support.js"></script>
<script src="./w24-data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D1016}
button{font-family:'IBM Plex Sans',sans-serif}
.mono{font-family:'IBM Plex Mono',monospace}
.chip{display:inline-flex;align-items:baseline;gap:5px;font:400 12px 'IBM Plex Mono',monospace;padding:2px 7px;border-radius:4px;border:1px solid #262E3E;background:#1A2030;color:#A1AABB;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip b{font-weight:400;color:#E4E8EF}
.lbl{font-size:11px;color:#8590A3;text-transform:uppercase;letter-spacing:.05em}
table.t{border-collapse:collapse;width:100%;font:400 13px 'IBM Plex Mono',monospace}
table.t th{font-weight:400;color:#A1AABB;text-align:right;padding:8px 12px;border-bottom:1px solid #262E3E}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:8px 12px;text-align:right;border-bottom:1px solid #1A2030;color:#E4E8EF}
</style>
</helmet>
<div style="width: 100%; min-height: 100%; box-sizing: border-box; padding: 24px; background: #0D1016; color: #E4E8EF; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px;">
<div style="border: 1px solid #262E3E; border-radius: 6px; background: #131720; overflow: hidden;">
<div style="padding: 12px 16px; border-bottom: 1px solid #262E3E; display: flex; align-items: baseline; gap: 8px;"><span style="font-weight: 600;">Je Region</span><span style="color: #8590A3; font-size: 12px;">Wo gewinnt welcher Wert, Region für Region?</span><span style="flex: 1;"></span><span style="font-size: 12px; color: #8590A3; border: 1px dashed #3A4458; border-radius: 4px; padding: 2px 8px;">Stand v0.2.2</span></div>
<div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px;">
<div style="font-size: 17px; font-weight: 600;">{{R.title}}</div>
<div style="color: #8590A3; font-size: 13px; line-height: 1.5;">{{oldSub}}</div>
<table class="t"><thead><tr><sc-for list="{{R.cols}}" as="c" hint-placeholder-count="5"><th>{{c}}</th></sc-for></tr></thead><tbody><sc-for list="{{tableRows}}" as="r" hint-placeholder-count="4"><tr><sc-for list="{{r.cells}}" as="c" hint-placeholder-count="5"><td style="{{c.st}}">{{c.t}}</td></sc-for></tr></sc-for></tbody></table>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":560}}'>
class Component extends DCLogic {
renderVals() {
  const st = this.state || {}, set = (p) => this.setState(p), D = window.W24 || { region: { fixed: [], what: [], rows: [], cols: [] }, config: { combo: [] } };
  const R = D.region, C = D.config;
  const fixedChips = R.fixed.map(([k, v]) => ({ k, v, title: k + ' = ' + v }));
  const shown = st.more ? fixedChips : fixedChips.slice(0, 4);
  const tableRows = R.rows.map((r) => ({ cells: r.slice(0, 5).map((t, i) => ({ t, st: i === r[5] ? 'background: #11221B; color: #5FD4A0; font-weight: 500;' : '' })) }));
  const combo = C.combo.map(([k, v, grid]) => ({ k, v: v === null ? 'null' : v, isNull: v === null,
    vSt: v === null ? 'color: #6B7385; font-style: italic;' : 'color: #E4E8EF;', long: !!(v && v.length > 18) }));
  return { R, tableRows, shown, oldSub: R.what.map((w) => w.v).join(' ') + ' · fest: ' + R.fixed.map(([k, v]) => k + ' = ' + v).join(', ') + ' · ' + R.agg,
    toggleMore: () => set({ more: !st.more }), moreLabel: st.more ? 'weniger' : '+' + (fixedChips.length - 4) + ' weitere', };
}
}
</script>
</body>
</html>
