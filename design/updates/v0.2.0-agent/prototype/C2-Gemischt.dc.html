<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>C2 · Modus Gemischt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D1016}
button{font-family:'IBM Plex Sans',sans-serif}
button:focus-visible{outline:2px solid #6E9BF5;outline-offset:1px}
</style>
</helmet>
<div style="width: 100%; height: 780px; box-sizing: border-box; position: relative; overflow: hidden; background: repeating-linear-gradient(0deg, #0D1016 0 27px, #121621 27px 28px); color: #E4E8EF; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px;">
<div style="position: absolute; left: 0; top: 0; right: 0; height: 36px; background: #131720; border-bottom: 1px solid #262E3E; display: flex; align-items: center; gap: 0; font: 400 12px 'IBM Plex Mono', monospace; color: #8590A3;">
<span style="padding: 0 14px; font-family: 'IBM Plex Sans';">Läufe</span>
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="1"><span style="{{t.st}}">{{t.label}}</span></sc-for>
</div>
<section aria-label="Agent" style="position: absolute; left: 40px; top: 70px; width: 460px; height: 680px; display: flex; flex-direction: column; background: rgba(19,23,32,.97); border: 1px solid #2C3547; border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.55);">
<header style="height: 38px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border-bottom: 1px solid #262E3E; background: #161B26; border-radius: 10px 10px 0 0;">
<svg width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="#6E9BF5" stroke-width="1.6"><path d="M9 2.5l1.4 3.6 3.6 1.4-3.6 1.4L9 12.5 7.6 8.9 4 7.5l3.6-1.4z"/></svg>
<span style="font-weight: 600;">pred_len 90 · Parameter</span><span style="color: #8590A3;">▾</span>
<span style="flex: 1;"></span><span style="color: #8590A3; font-size: 15px; padding: 0 6px;">+ – ×</span>
</header>
<div style="flex-shrink: 0; padding: 8px 12px; border-bottom: 1px solid #1E2533; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8590A3;">sieht<span style="padding: 2px 8px; border-radius: 10px; background: #192640; border: 1px solid #2C4572; color: #C9D3E3; font-family: 'IBM Plex Mono', monospace;">{{ctx}}</span></div>
<div style="flex: 1; min-height: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 9px;">
<sc-for list="{{items}}" as="m" hint-placeholder-count="6">
<sc-if value="{{m.isUser}}"><div style="align-self: flex-end; max-width: 85%; background: #192640; border: 1px solid #2C4572; border-radius: 10px 10px 2px 10px; padding: 7px 10px; line-height: 1.45;">{{m.t}}</div></sc-if>
<sc-if value="{{m.isAgent}}"><div style="max-width: 94%; line-height: 1.5;">{{m.t}}</div></sc-if>
<sc-if value="{{m.isChoice}}"><div style="display: flex; flex-direction: column; gap: 6px;">
<sc-for list="{{m.opts}}" as="o" hint-placeholder-count="2"><button onClick="{{o.on}}" style="{{o.st}}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px;">{{o.name}}</span><span style="color: #8590A3; font-size: 11px;">{{o.sub}}</span></button></sc-for>
</div></sc-if>
<sc-if value="{{m.isDone}}"><div style="{{m.st}}"><span style="{{m.iconSt}}">{{m.icon}}</span><span style="{{m.textSt}}">{{m.t}}</span><span style="color: #6B7385; font-size: 11px; white-space: nowrap;">{{m.how}}</span><button onClick="{{m.undo}}" style="background: none; border: 0; color: #6E9BF5; cursor: pointer; font-size: 12px; padding: 0 2px; white-space: nowrap;">{{m.undoLabel}}</button></div></sc-if>
<sc-if value="{{m.isPending}}"><div style="border: 1px solid #6E5A2A; background: rgba(196,127,20,.08); border-radius: 8px; padding: 9px 10px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; gap: 8px; align-items: baseline;"><span style="color: #E0A43A; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;">Bestätigen</span><span style="line-height: 1.45;">{{m.t}}</span></div>
<sc-if value="{{m.hasDetail}}"><div style="font: 400 11px 'IBM Plex Mono', monospace; color: #A1AABB; background: #131720; border-radius: 4px; padding: 6px 8px;">{{m.detail}}</div></sc-if>
<div style="display: flex; gap: 6px;"><button onClick="{{m.ok}}" style="padding: 5px 12px; border-radius: 5px; border: 0; background: #2F5BD3; color: #fff; cursor: pointer; font-size: 12px;">{{m.okLabel}}</button><button onClick="{{m.no}}" style="padding: 5px 12px; border-radius: 5px; border: 1px solid #2C3547; background: none; color: #A1AABB; cursor: pointer; font-size: 12px;">Ablehnen</button><span style="flex: 1;"></span><span style="color: #6B7385; font-size: 11px; align-self: center;">Enter = ausführen</span></div>
</div></sc-if>
</sc-for>
</div>
<div style="flex-shrink: 0; padding: 10px; border-top: 1px solid #262E3E; position: relative;">
<sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 10px; bottom: 92px; width: 360px; background: #1A2030; border: 1px solid #2C4572; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.45); padding: 6px; z-index: 3;">
<div style="font-size: 11px; color: #8590A3; padding: 4px 8px 6px;">Wie soll der Agent handeln?</div>
<sc-for list="{{modes}}" as="d" hint-placeholder-count="3"><button onClick="{{d.on}}" style="{{d.st}}"><span style="font-weight: 600;">{{d.label}}</span><span style="color: #A1AABB; font-size: 12px; line-height: 1.4;">{{d.desc}}</span></button></sc-for>
</div>
</sc-if>
<div style="display: flex; align-items: center; gap: 6px; border: 1px solid #2C3547; background: #1A2030; border-radius: 8px; padding: 6px 6px 6px 10px;">
<span style="flex: 1; color: #6B7385; padding: 5px 0;">Frag oder sag dem Agenten, was er tun soll …</span>
<span title="Sprache kommt in einem späteren Update" style="width: 30px; height: 30px; border-radius: 6px; border: 1px solid #262E3E; color: #4A5265; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6.5" y="2" width="5" height="9" rx="2.5"/><path d="M4 8.5a5 5 0 0 0 10 0M9 13.5V16"/></svg></span>
<span style="width: 30px; height: 30px; border-radius: 6px; background: #2F5BD3; color: #fff; display: flex; align-items: center; justify-content: center;">↑</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 11px; color: #8590A3;">
<button onClick="{{toggleMenu}}" title="Modus wechseln (Shift+Tab)" style="{{modeBtnSt}}">{{modeIcon}} {{modeLabel}} ▾</button>
<span>{{modeHint}}</span><span style="flex: 1;"></span><button onClick="{{reset}}" style="background: none; border: 0; color: #6B7385; cursor: pointer; font-size: 11px;">Beispiel neu starten</button>
</div>
</div>
</section>
<div style="position: absolute; left: 524px; top: 70px; width: 0; right: 0;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":780}}'>
// Block C: the same example chat in three agent modes. Clicks on choices, Ausführen/Ablehnen and
// Rückgängig change the state; the mode switch replays the example in the chosen mode.
const MODES = [
  { key: 'direct', label: 'Direkt', icon: '⏵⏵', desc: 'Handelt sofort. Jede Aktion lässt sich rückgängig machen.', hint: 'handelt ohne Rückfrage', col: '#3FB68B' },
  { key: 'mixed', label: 'Gemischt', icon: '⏵', desc: 'Suchen, Navigieren und Ansicht sofort. Analyse ändern und Speichern erst nach Bestätigung.', hint: 'fragt bei Änderungen und Speichern', col: '#6E9BF5' },
  { key: 'confirm', label: 'Bestätigen', icon: '⏸', desc: 'Fragt vor jeder Aktion. Auch danach rückgängig machbar.', hint: 'fragt vor jeder Aktion', col: '#E0A43A' }
];
const RUNS = [
  { id: 'TIM-52_best_combined_90', sub: '14.10. 09:12 · läuft · lstm_layer, time_embedding, conv_dims, lr_epochs' },
  { id: 'TIM-53_calendar_init_90', sub: '14.10. 15:30 · fertig · calendar_init, calendar_mode' }
];
// one script, each action has a kind: 'nav' (immediate in direct + mixed) or 'change' (immediate only in direct)
const ACTIONS = [
  { id: 'a1', kind: 'nav', t: 'Tab öffnen · TIM-52_best_combined_90', done: 'Tab geöffnet · TIM-52_best_combined_90', undone: 'Tab wieder geschlossen' },
  { id: 'a2', kind: 'nav', t: 'Filter setzen · lstm_layer = 3', done: 'Filter gesetzt · lstm_layer = 3', undone: 'Filter entfernt' },
  { id: 'a3', kind: 'change', t: 'Ergebnistabelle als Bild speichern', detail: 'deliverables/2026-10-16 Meeting/tim52_lstm3_ergebnis.png', done: 'Gespeichert · tim52_lstm3_ergebnis.png', undone: 'Datei wieder gelöscht' }
];
class Component extends DCLogic {
renderVals() {
  const st = this.state || {};
  const set = (p) => this.setState(p);
  const mode = st.mode || 'mixed';
  const M = MODES.find((m) => m.key === mode);
  const picked = st.picked || null;
  const act = st.act || {};            // id -> 'done' | 'undone' | 'rejected'
  const auto = (a) => mode === 'direct' || (mode === 'mixed' && a.kind === 'nav');
  const stateOf = (a) => act[a.id] || (auto(a) ? 'done' : 'pending');
  const items = [{ k: 'user', t: 'Öffne das Experiment von gestern mit pred_len 90 und zeig nur lstm_layer 3.' },
    { k: 'agent', t: 'Gestern gab es zwei Läufe mit pred_len 90. Welchen meinst du?' },
    { k: 'choice' }];
  // the chain stops at the first pending action
  let blocked = !picked;
  const pushAction = (a) => {
    if (blocked) return;
    const s = stateOf(a);
    items.push({ k: 'action', a, s, how: act[a.id] ? '' : (auto(a) ? 'direkt' : '') });
    if (s === 'pending') blocked = true;
  };
  if (picked) { pushAction(ACTIONS[0]); pushAction(ACTIONS[1]); }
  if (!blocked) {
    items.push({ k: 'agent', t: 'Erledigt. In TIM-52_best_combined_90 bleiben mit lstm_layer = 3 36 Kombinationen, die beste hat 5,81 % MAPE.' });
    items.push({ k: 'user', t: 'Speicher die Ergebnistabelle als Bild fürs Meeting morgen.' });
    pushAction(ACTIONS[2]);
    if (!blocked && stateOf(ACTIONS[2]) === 'done') items.push({ k: 'agent', t: 'Liegt im Deliverable-Ordner für morgen.' });
  }
  const setAct = (id, v) => set({ act: Object.assign({}, act, { [id]: v }) });
  const rowSt = (s) => 'display: flex; align-items: center; gap: 8px; font-size: 12px; border: 1px ' + (s === 'done' ? 'solid #23402F' : 'dashed #2C3547') + '; background: ' + (s === 'done' ? 'rgba(63,182,139,.06)' : 'transparent') + '; border-radius: 6px; padding: 6px 9px;';
  return {
    ctx: picked ? 'Lauf · TIM-52_best_combined_90' + (stateOf(ACTIONS[1]) === 'done' ? ' · lstm_layer = 3' : '') : 'Läufe · Liste',
    tabs: picked && stateOf(ACTIONS[0]) === 'done' ? [{ label: 'TIM-52_best_combined_90', st: 'padding: 0 14px; height: 100%; display: flex; align-items: center; border-left: 1px solid #262E3E; border-top: 2px solid #6E9BF5; background: #0D1016; color: #E4E8EF; box-shadow: inset 0 0 0 1px rgba(110,155,245,.5);' }] : [],
    items: items.map((m) => {
      if (m.k === 'choice') return { isChoice: true, opts: RUNS.map((r) => ({ name: r.id, sub: r.sub, on: () => set({ picked: picked || r.id }),
        st: 'display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 7px 10px; border-radius: 6px; cursor: pointer; color: #E4E8EF; border: 1px solid ' + (picked === r.id ? '#6E9BF5' : '#2C3547') + '; background: ' + (picked === r.id ? '#192640' : '#161B26') + '; opacity: ' + (picked && picked !== r.id ? '.45' : '1') + ';' })) };
      if (m.k !== 'action') return { isUser: m.k === 'user', isAgent: m.k === 'agent', t: m.t };
      const a = m.a, s = m.s;
      if (s === 'pending') return { isPending: true, t: a.t, hasDetail: !!a.detail, detail: a.detail || '', okLabel: a.kind === 'change' ? 'Speichern' : 'Ausführen', ok: () => setAct(a.id, 'done'), no: () => setAct(a.id, 'rejected') };
      return { isDone: true, st: rowSt(s), icon: s === 'done' ? '✓' : s === 'rejected' ? '✕' : '↶', iconSt: 'color: ' + (s === 'done' ? '#3FB68B' : '#8590A3') + ';',
        t: s === 'done' ? a.done : s === 'rejected' ? 'Abgelehnt · ' + a.t : a.undone,
        textSt: 'flex: 1; min-width: 0; color: ' + (s === 'done' ? '#C9D3E3' : '#8590A3') + ';',
        how: s === 'done' ? m.how : '', undoLabel: s === 'done' ? 'Rückgängig' : s === 'undone' ? 'Wiederholen' : '',
        undo: () => setAct(a.id, s === 'done' ? 'undone' : 'done') };
    }),
    menu: !!st.menu, toggleMenu: () => set({ menu: !st.menu }),
    modes: MODES.map((d) => ({ label: d.icon + '  ' + d.label, desc: d.desc, on: () => set({ mode: d.key, menu: false, act: {}, picked: null }),
      st: 'width: 100%; display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 8px 9px; border: 0; border-radius: 5px; cursor: pointer; color: #E4E8EF; background: ' + (d.key === mode ? '#192640' : 'transparent') + ';' })),
    modeLabel: M.label, modeIcon: M.icon, modeHint: M.hint,
    modeBtnSt: 'background: none; border: 1px solid #2C3547; border-radius: 10px; padding: 2px 8px; cursor: pointer; font-size: 11px; color: ' + M.col + ';',
    reset: () => set({ act: {}, picked: null, menu: false })
  };
}
}
</script>
</body>
</html>
