<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Läufe · Issues</title>
<script src="./support.js"></script>
<script src="./runs-data.js"></script>
<script src="./short-data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#131315}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #8AA4FF;outline-offset:2px}
.scr{scrollbar-width:thin;scrollbar-color:#34343C transparent}
.scr::-webkit-scrollbar{width:10px}
.scr::-webkit-scrollbar-track{background:transparent}
.scr::-webkit-scrollbar-thumb{background:#34343C;border-radius:6px;border:3px solid #131315}
.scr::-webkit-scrollbar-thumb:hover{background:#45454F}
.card{transition:border-color .12s,background .12s}
.card:hover{border-color:#3A3A44;background:#1F1F24}
.pill:hover{background:#2A2A31;color:#EEEEF1}
.nav:hover{background:#1F1F24}
</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #131315; color: #EEEEF1; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px;">
<div style="flex: 1; min-height: 0; display: flex;">
<aside class="scr" style="width: 330px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid #26262C; background: #161618; padding: 22px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px;">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 14px;"><span style="font-size: 20px; font-weight: 600;">Läufe</span><span style="flex: 1;"></span><div style="display: flex; padding: 3px; gap: 2px; background: #1C1C20; border: 1px solid #2E2E35; border-radius: 18px;"><a onClick="{{toList}}" style="font-size: 12px; color: #B0B0BA; border-radius: 14px; padding: 4px 12px; cursor: pointer;">Liste</a><span style="font: 500 12px 'IBM Plex Sans', sans-serif; color: #131315; background: #EEEEF1; border-radius: 14px; padding: 4px 12px;">Issues</span></div></div>
<div style="display: flex; align-items: center; gap: 8px; margin: 0 6px 16px; padding: 7px 12px; background: #1C1C20; border: 1px solid #2E2E35; border-radius: 18px; color: #7C7C87;"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>Issue oder Lauf suchen</div>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
<button class="nav" onClick="{{n.on}}" style="{{n.st}}">
<span style="{{n.dot}}"></span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; text-align: left;">
<span style="display: flex; gap: 8px; align-items: baseline;"><span style="font: 500 11.5px 'IBM Plex Mono', monospace; color: #B0B0BA;">{{n.key}}</span><span style="font-size: 11.5px; color: #7C7C87;">{{n.when}}</span><sc-if value="{{n.running}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; color: #8AA4FF;">● läuft</span></sc-if></span>
<span style="font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{n.title}}</span>
</span>
<span style="font: 400 11.5px 'IBM Plex Mono', monospace; color: #7C7C87; align-self: flex-start; margin-top: 2px;">{{n.count}}</span>
</button>
</sc-for>
</aside>
<main class="scr" style="flex: 1; min-width: 0; overflow-y: auto; padding: 28px 36px 100px; box-sizing: border-box;">
<div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px;">
<div style="display: flex; align-items: center; gap: 10px;"><span style="font: 500 12px 'IBM Plex Mono', monospace; color: #B0B0BA; background: #222227; border-radius: 6px; padding: 3px 8px;">{{cur.key}}</span><span style="{{cur.statusSt}}">{{cur.status}}</span><span style="flex: 1;"></span><sc-for list="{{cur.links}}" as="l" hint-placeholder-count="1"><span class="pill" style="font-size: 12px; color: #B0B0BA; background: #1C1C20; border: 1px solid #2E2E35; border-radius: 16px; padding: 5px 12px;">{{l}}</span></sc-for></div>
<span style="font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; max-width: 860px;">{{cur.title}}</span>
<span style="color: #7C7C87;">{{cur.meta}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
<sc-for list="{{cur.cards}}" as="c" hint-placeholder-count="2">
<div class="card" style="{{c.cardSt}}">
<div style="display: flex; align-items: flex-start; gap: 10px;">
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0;">
<a onClick="{{c.open}}" style="font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #EEEEF1; cursor: pointer;">{{c.name}}</a>
<span style="font-size: 12px; color: #7C7C87;">{{c.when}}</span>
</div>
<button onClick="{{c.toggleSel}}" aria-pressed="{{c.sel}}" aria-label="zum Vergleich auswählen" style="{{c.chkSt}}"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></button>
</div>
<span style="{{c.shortSt}}">{{c.short}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><sc-for list="{{c.axes}}" as="a" hint-placeholder-count="3"><span style="font: 400 11px 'IBM Plex Mono', monospace; color: #B0B0BA; background: #24242A; border-radius: 5px; padding: 2px 7px;">{{a}}</span></sc-for></div>
<div style="display: flex; align-items: flex-end; gap: 16px; margin-top: auto;">
<div style="display: flex; flex-direction: column; gap: 5px; flex: 1;"><span style="height: 5px; border-radius: 3px; background: #2E2E35; overflow: hidden; display: flex;"><span style="{{c.okBar}}"></span><span style="{{c.errBar}}"></span></span><span style="{{c.cellSt}}">{{c.cellText}}</span></div>
<div style="display: flex; flex-direction: column; text-align: right;"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500;">{{c.best}}</span><span style="font-size: 11px; color: #7C7C87;">MAPE · pred_len {{c.h}}</span></div>
</div>
<sc-if value="{{c.hasOlder}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #7C7C87; border-top: 1px solid #2A2A31; padding-top: 9px;">+ {{c.older}} · ältere Läufe</span></sc-if>
</div>
</sc-for>
</div>
</main>
</div>

<sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: calc(50% + 165px); bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 18px; background: #26262C; border: 1px solid #3A3A44; border-radius: 24px; box-shadow: 0 16px 40px rgba(0,0,0,.5);">
<span>{{selText}}</span>
<button onClick="{{clearSel}}" style="font-size: 12px; color: #B0B0BA; background: transparent; border: 0; padding: 6px 8px; cursor: pointer;">Aufheben</button>
<button style="{{cmpSt}}">Vergleichen</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1384,"height":798},"openRun":{"editor":null},"setView":{"editor":null}}'>
class Component extends DCLogic {
renderVals() {
  const P = this.props || {};
  const R = window.RunsData, SH = window.SHORTS || {};
  const st = this.state || {};
  const set = (p) => this.setState(p);
  const sel = st.sel || {};
  const f = st.f || 'all';
  const chipOn = "font: 500 12px 'IBM Plex Sans', sans-serif; color: #131315; background: #EEEEF1; border: 0; border-radius: 16px; padding: 6px 13px; cursor: pointer;";
  const chipOff = "font: 400 12px 'IBM Plex Sans', sans-serif; color: #B0B0BA; background: #1C1C20; border: 1px solid #2E2E35; border-radius: 16px; padding: 5px 12px; cursor: pointer;";
  const chips = [['all', 'Alle'], ['running', 'Läuft'], ['errors', 'Mit Fehlern'], ['week', 'Diese Woche']].map(([k, l]) => ({ label: l, st: f === k ? chipOn : chipOff, on: () => set({ f: k }) }));
  const weekAgo = new Date(R.TODAY.getTime() - 7 * 86400000);
  const match = (r) => f === 'all' || (f === 'running' && r.running) || (f === 'errors' && r.err > 0) || (f === 'week' && r.date >= weekAgo);
  const stCol = { 'In Progress': ['#262B42', '#A9BBFF'], 'In Review': ['#3A2E1F', '#F4C27A'], 'Todo': ['#26262C', '#B0B0BA'], 'Done': ['#1D3329', '#7BDDB0'], 'Committed': ['#1D3329', '#7BDDB0'] };
  const G = R.groups();
  const curKey = st.cur || G[0].key;
  const cardOf = (e) => {
    const r = e.runs[0], on = !!sel[r.id];
    return {
      sel: on, open: () => P.openRun && P.openRun(r.id), name: r.issue ? r.exp.replace(r.issue + '_', '') : r.exp, when: (r.running ? 'läuft · ' : '') + R.rel(r.date),
      short: SH[r.id] || 'Keine Kurzbeschreibung',
      shortSt: 'line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 38px; color: ' + (SH[r.id] ? '#C8C8D0' : '#5E5E68') + ';' + (SH[r.id] ? '' : ' font-style: italic;'),
      axes: r.axes.slice(0, 3).concat(r.axes.length > 3 ? ['+' + (r.axes.length - 3)] : []),
      toggleSel: () => { const s = Object.assign({}, sel); s[r.id] = !s[r.id]; set({ sel: s }); },
      chkSt: 'width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; ' + (on ? 'background: #8AA4FF; border: 0; color: #131315;' : 'background: transparent; border: 1.5px solid #3A3A44; color: transparent;'),
      cardSt: 'display: flex; flex-direction: column; gap: 12px; min-height: 196px; box-sizing: border-box; padding: 16px 18px; border-radius: 12px; cursor: pointer; ' + (on ? 'background: #1E2132; border: 1px solid #8AA4FF;' : 'background: #1C1C20; border: 1px solid #2A2A31;'),
      okBar: 'height: 100%; background: ' + (r.running ? '#8AA4FF' : '#5A5A66') + '; width: ' + (r.ok / r.cells * 100).toFixed(1) + '%;',
      errBar: 'height: 100%; background: #FF6B6B; width: ' + (r.err / r.cells * 100).toFixed(1) + '%;',
      cellText: r.running ? R.fmt(r.done) + ' / ' + R.fmt(r.cells) + ' Zellen' : R.fmt(r.cells) + ' Zellen' + (r.err ? ' · ' + R.fmt(r.err) + ' Fehler' : ''),
      cellSt: "font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: " + (r.err && !r.running ? '#FF8A8A' : '#7C7C87') + ';',
      best: R.fmt(r.best, 2) + ' %', h: r.h,
      hasOlder: e.runs.length > 1, older: e.runs.length - 1
    };
  };
  const dotCol = { 'In Progress': '#8AA4FF', 'In Review': '#F4C27A', 'Todo': '#7C7C87', 'Done': '#5FD4A0', 'Committed': '#5FD4A0' };
  const nav = G.map((g) => {
    const on = g.key === curKey, iss = g.issue;
    return {
      key: iss ? g.key : 'ohne Issue', title: iss ? iss.title : 'Läufe ohne Issue', when: R.rel(g.last), count: String(g.runs.length),
      running: g.runs.some((r) => r.running),
      dot: 'width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; align-self: flex-start; background: ' + (iss ? dotCol[iss.status] || '#7C7C87' : '#4A4A52') + ';',
      st: 'display: flex; gap: 10px; align-items: center; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px; cursor: pointer; color: #EEEEF1; font-size: 13px; ' + (on ? 'background: #222330; box-shadow: inset 0 0 0 1px #3A4166;' : 'background: transparent;'),
      on: () => set({ cur: g.key })
    };
  });
  const g = G.find((x) => x.key === curKey) || G[0];
  const iss = g.issue, c = iss ? (stCol[iss.status] || stCol.Todo) : stCol.Todo;
  const links = [];
  if (iss && iss.analysis) links.push('Bericht');
  if (iss && iss.deliverable) links.push('Deliverables');
  const cur = {
    key: iss ? g.key : 'ohne Issue', title: iss ? iss.title : 'Läufe ohne Issue', status: iss ? iss.status : '',
    statusSt: iss ? 'font-size: 11.5px; font-weight: 500; white-space: nowrap; border-radius: 10px; padding: 2px 9px; background: ' + c[0] + '; color: ' + c[1] + ';' : 'display: none;',
    links, meta: g.experiments.length + (g.experiments.length === 1 ? ' Experiment' : ' Experimente') + ' · ' + g.runs.length + (g.runs.length === 1 ? ' Lauf' : ' Läufe') + ' · zuletzt ' + R.rel(g.last),
    cards: g.experiments.map(cardOf)
  };
  const nr = R.RUNS.slice().sort((a, b) => b.date - a.date)[0];
  const nSel = Object.keys(sel).filter((k) => sel[k]).length;
  return {
    toList: () => P.setView && P.setView('runs'),
    chips, nav, cur,
    newest: { when: R.rel(nr.date), name: nr.id, short: SH[nr.id] || '',
      barSt: 'height: 100%; background: #8AA4FF; width: ' + (nr.done / nr.cells * 100).toFixed(1) + '%;',
      cellText: R.fmt(nr.done) + ' / ' + R.fmt(nr.cells) + ' Zellen · 46 %', best: R.fmt(nr.best, 2) + ' %' },
    hasSel: nSel > 0, selText: nSel + (nSel === 1 ? ' Lauf ausgewählt' : ' Läufe ausgewählt'),
    clearSel: () => set({ sel: {} }),
    cmpSt: "font: 500 13px 'IBM Plex Sans', sans-serif; border-radius: 18px; padding: 7px 16px; border: 0; cursor: pointer; " + (nSel >= 2 ? 'color: #131315; background: #8AA4FF;' : 'color: #7C7C87; background: #34343C;')
  };
}
}
</script>
</body>
</html>
